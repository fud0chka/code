name: Build PampGram Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        path: my-workspace

    - name: Clone Telegram-iOS
      uses: actions/checkout@v4
      with:
        repository: TelegramMessenger/Telegram-iOS
        submodules: recursive
        path: telegram

    - name: Select Xcode 26.2
      run: |
        sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
        sudo xcodebuild -license accept

    - name: Setup Bazelisk
      run: brew install bazelisk

    - name: Unpack everything
      run: |
        mkdir -p /tmp/pamp_all
        
        if [ -f my-workspace/pampgram.zip ]; then
          unzip -o my-workspace/pampgram.zip -d /tmp/pamp_all/
        fi
        
        if [ -f my-workspace/code.zip ]; then
          unzip -o my-workspace/code.zip -d /tmp/code_zip/
          find /tmp/code_zip -name "*.swift" -not -path "*/__MACOSX/*" -exec cp {} /tmp/pamp_all/ \;
        fi
        
        echo "=== Что распаковалось ==="
        find /tmp/pamp_all -type d | head -30
        find /tmp/pamp_all -name "*.swift" | head -40

    - name: Create modules structure
      run: |
        mkdir -p telegram/submodules/PampGramCore/Sources
        mkdir -p telegram/submodules/PhantomGiftKit/Sources
        mkdir -p telegram/submodules/PampGramSettingsUI/Sources
        mkdir -p telegram/submodules/PampGram/Sources
        
        if [ -d /tmp/pamp_all/PampGramCore ]; then
          find /tmp/pamp_all/PampGramCore -name "*.swift" -exec cp {} telegram/submodules/PampGramCore/Sources/ \;
        fi
        
        if [ -d /tmp/pamp_all/PhantomGiftKit ]; then
          find /tmp/pamp_all/PhantomGiftKit -name "*.swift" -exec cp {} telegram/submodules/PhantomGiftKit/Sources/ \;
        fi
        
        if [ -d /tmp/pamp_all/PampGramSettingsUI ]; then
          find /tmp/pamp_all/PampGramSettingsUI -name "*.swift" -exec cp {} telegram/submodules/PampGramSettingsUI/Sources/ \;
        fi
        
        # Всё остальное в основной модуль
        find /tmp/pamp_all -name "*.swift" \
          -not -path "*/PampGramCore/*" \
          -not -path "*/PhantomGiftKit/*" \
          -not -path "*/PampGramSettingsUI/*" \
          -exec cp {} telegram/submodules/PampGram/Sources/ \;
        
        echo "=== PampGramCore ==="
        ls telegram/submodules/PampGramCore/Sources/ || true
        echo "=== PhantomGiftKit ==="
        ls telegram/submodules/PhantomGiftKit/Sources/ || true
        echo "=== PampGramSettingsUI ==="
        ls telegram/submodules/PampGramSettingsUI/Sources/ || true
        echo "=== PampGram ==="
        ls telegram/submodules/PampGram/Sources/ || true

    - name: Create BUILD files
      run: |
        # === PampGramCore ===
        cat > telegram/submodules/PampGramCore/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")

        swift_library(
            name = "PampGramCore",
            module_name = "PampGramCore",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
                "//submodules/AccountContext:AccountContext",
            ],
            visibility = ["//visibility:public"],
        )
        EOF

        # === PhantomGiftKit ===
        cat > telegram/submodules/PhantomGiftKit/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")

        swift_library(
            name = "PhantomGiftKit",
            module_name = "PhantomGiftKit",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
                "//submodules/AccountContext:AccountContext",
                "//submodules/PampGramCore:PampGramCore",
            ],
            visibility = ["//visibility:public"],
        )
        EOF

        # === PampGramSettingsUI ===
        cat > telegram/submodules/PampGramSettingsUI/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")

        swift_library(
            name = "PampGramSettingsUI",
            module_name = "PampGramSettingsUI",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
                "//submodules/AccountContext:AccountContext",
                "//submodules/PampGramCore:PampGramCore",
                "//submodules/ItemListUI:ItemListUI",
                "//submodules/TelegramPresentationData:TelegramPresentationData",
                "//submodules/PresentationDataUtils:PresentationDataUtils",
                "//submodules/Display:Display",
                "//submodules/TelegramUIPreferences:TelegramUIPreferences",
            ],
            visibility = ["//visibility:public"],
        )
        EOF

        # === Основной PampGram + Framework ===
        cat > telegram/submodules/PampGram/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleIdentifier</key>
          <string>org.telegram.PampGram</string>
          <key>CFBundleName</key>
          <string>PampGram</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
          <key>CFBundlePackageType</key>
          <string>FMWK</string>
        </dict>
        </plist>
        EOF

        cat > telegram/submodules/PampGram/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")
        load("@build_bazel_rules_apple//apple:ios.bzl", "ios_framework")

        swift_library(
            name = "PampGramLib",
            module_name = "PampGram",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
                "//submodules/AccountContext:AccountContext",
                "//submodules/PampGramCore:PampGramCore",
                "//submodules/PhantomGiftKit:PhantomGiftKit",
                "//submodules/PampGramSettingsUI:PampGramSettingsUI",
            ],
            visibility = ["//visibility:public"],
        )

        ios_framework(
            name = "PampGramFramework",
            bundle_id = "org.telegram.PampGram",
            families = ["iphone", "ipad"],
            infoplists = ["Info.plist"],
            minimum_os_version = "13.0",
            deps = [":PampGramLib"],
        )
        EOF

    - name: Create config
      run: |
        cd telegram
        mkdir -p build-input
        cat > build-input/data.json << 'EOF'
        {
          "bundle_id": "org.telegram.Telegram-iOS",
          "api_id": "8",
          "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
          "team_id": "XXXXXXXXXX",
          "app_center_id": "",
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "tg",
          "premium_iap_product_id": "",
          "enable_siri": false,
          "enable_icloud": false
        }
        EOF

    - name: Build
      run: |
        cd telegram
        python3 build-system/Make/Make.py \
          --overrideXcodeVersion \
          build \
          --configurationPath=build-input/data.json \
          --configuration=release_arm64 \
          --buildNumber=10000 \
          --xcodeManagedCodesigning \
          --target=//submodules/PampGram:PampGramFramework

    - name: Extract dylib
      run: |
        FRAMEWORK=$(find telegram/bazel-out -path "*PampGramFramework.framework" -type d | head -1)
        
        if [ -z "$FRAMEWORK" ]; then
          echo "Framework не найден"
          find telegram/bazel-out -iname "*pamp*" | head -50
          exit 1
        fi
        
        echo "Найден: $FRAMEWORK"
        
        if [ -f "$FRAMEWORK/PampGramFramework" ]; then
          cp "$FRAMEWORK/PampGramFramework" ./PampGram.dylib
        elif [ -f "$FRAMEWORK/PampGram" ]; then
          cp "$FRAMEWORK/PampGram" ./PampGram.dylib
        else
          find "$FRAMEWORK" -type f
          exit 1
        fi
        
        ls -lh PampGram.dylib
        file PampGram.dylib
        otool -hv PampGram.dylib | head -15

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PampGram-dylib
        path: PampGram.dylib
