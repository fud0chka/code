name: Build PampGram Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-dylib:
    runs-on: macos-26

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 26.2
      run: |
        sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
        sudo xcodebuild -license accept
        xcodebuild -version

    - name: Prepare sources
      run: |
        mkdir -p sources
        if [ -f code.zip ]; then
          unzip -o code.zip -d sources/
        else
          echo "ERROR: code.zip не найден в корне репозитория!"
          exit 1
        fi
        
        echo "=== Найденные Swift-файлы ==="
        find sources -name "*.swift" | head -50

    - name: Build dylib (arm64)
      run: |
        cd sources
        
        # Собираем все .swift файлы в один dylib
        SWIFT_FILES=$(find . -name "*.swift" | tr '\n' ' ')
        
        if [ -z "$SWIFT_FILES" ]; then
          echo "ERROR: Swift-файлы не найдены!"
          exit 1
        fi
        
        echo "Компилируем: $SWIFT_FILES"
        
        xcrun -sdk iphoneos swiftc \
          -emit-library \
          -o ../PampGram.dylib \
          -target arm64-apple-ios13.0 \
          -O \
          -module-name PampGram \
          $SWIFT_FILES
        
        echo "=== Результат ==="
        ls -lh ../PampGram.dylib
        file ../PampGram.dylib
        otool -hv ../PampGram.dylib | head -20

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: PampGram-dylib
        path: PampGram.dylib
