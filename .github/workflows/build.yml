name: Build PampGram Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        path: my-workspace

    - name: Clone Telegram-iOS
      uses: actions/checkout@v4
      with:
        repository: TelegramMessenger/Telegram-iOS
        submodules: recursive
        path: telegram

    - name: Select Xcode 26.2
      run: |
        sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
        sudo xcodebuild -license accept
        xcodebuild -version

    - name: Setup Bazel
      run: brew install bazelisk

    - name: Prepare PampGram sources
      run: |
        mkdir -p telegram/submodules/PampGram/Sources
        
        unzip -o my-workspace/code.zip -d /tmp/pamp_src/
        
        # Копируем только настоящие .swift
        find /tmp/pamp_src -name "*.swift" -not -path "*/__MACOSX/*" -exec cp {} telegram/submodules/PampGram/Sources/ \;
        
        echo "=== Swift-файлы ==="
        ls -la telegram/submodules/PampGram/Sources/

    - name: Create BUILD file
      run: |
        cat > telegram/submodules/PampGram/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")
        load("@build_bazel_rules_apple//apple:ios.bzl", "ios_framework")

        swift_library(
            name = "PampGramLib",
            module_name = "PampGram",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
            ],
            visibility = ["//visibility:public"],
        )

        ios_framework(
            name = "PampGramFramework",
            bundle_id = "org.telegram.PampGram",
            families = ["iphone", "ipad"],
            infoplists = [],
            minimum_os_version = "13.0",
            deps = [":PampGramLib"],
        )
        EOF

    - name: Create minimal configuration
      run: |
        cd telegram
        mkdir -p build-input/configuration-repository
        
        # Минимальный variables.bzl (нужен некоторым таргетам)
        cat > build-input/configuration-repository/variables.bzl << 'EOF'
        telegram_bundle_id = "org.telegram.Telegram-iOS"
        telegram_api_id = "1"
        telegram_api_hash = "00000000000000000000000000000000"
        telegram_team_id = "XXXXXXXXXX"
        telegram_app_center_id = ""
        telegram_is_internal_build = "false"
        telegram_is_appstore_build = "false"
        telegram_appstore_id = "0"
        telegram_app_specific_url_scheme = "tg"
        telegram_premium_iap_product_id = ""
        telegram_enable_siri = False
        telegram_enable_icloud = False
        telegram_bazel_path = "bazel"
        telegram_use_xcode_managed_codesigning = True
        EOF
        
        # Пустой data.json на всякий случай
        echo '{}' > build-input/data.json

    - name: Build PampGram Framework (без generateProject)
      run: |
        cd telegram
        
        # Собираем напрямую, без генерации Xcode-проекта
        bazel build //submodules/PampGram:PampGramFramework \
          --config=ios_arm64 \
          --compilation_mode=opt \
          --define=buildNumber=10000 \
          --//Telegram:disableExtensions \
          --//Telegram:disableStripping \
          --override_repository=build_configuration=$(pwd)/build-input/configuration-repository \
          --check_direct_dependencies=off

    - name: Extract dylib
      run: |
        FRAMEWORK=$(find telegram/bazel-out -path "*PampGramFramework.framework" -type d | head -1)
        
        if [ -z "$FRAMEWORK" ]; then
          echo "=== Framework не найден. Ищем всё ==="
          find telegram/bazel-out -iname "*pamp*" | head -40
          find telegram/bazel-bin -iname "*pamp*" | head -40
          exit 1
        fi
        
        echo "Найден framework: $FRAMEWORK"
        ls -la "$FRAMEWORK"
        
        if [ -f "$FRAMEWORK/PampGramFramework" ]; then
          BINARY="$FRAMEWORK/PampGramFramework"
        elif [ -f "$FRAMEWORK/PampGram" ]; then
          BINARY="$FRAMEWORK/PampGram"
        else
          echo "Бинарник не найден"
          find "$FRAMEWORK" -type f | head -20
          exit 1
        fi
        
        cp "$BINARY" ./PampGram.dylib
        
        echo "=== Готовый dylib ==="
        ls -lh PampGram.dylib
        file PampGram.dylib
        otool -hv PampGram.dylib | head -20

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: PampGram-dylib
        path: PampGram.dylib
