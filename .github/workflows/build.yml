name: Build PampGram Telegram Module

on:
  push:
    branches: [ "main" ]

jobs:
  build-pampgram:
    # Используем macOS 14 с актуальными версиями Xcode для сборки современных клиентов
    runs-on: macos-14 

    steps:
    # 1. Скачиваем ваш личный репозиторий, где хранится загруженный code.zip
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        path: my-workspace

            # 2. Клонируем репозиторий PampGram со всеми субмодулями через официальный экшен
    - name: Clone PampGram Repository
      uses: actions/checkout@v4
      with:
        repository: 'pochtadantov-eng/PampGram'
        submodules: 'recursive'
        path: 'pampgram'

    # 3. Устанавливаем Bazelisk (инструмент автоматического управления версиями Bazel)
    - name: Setup Bazel Build Tool
      run: brew install bazelisk

    # 4. Распаковываем ваш ZIP-архив с обновленными .swift файлами
    # Скрипт заменяет или дополняет файлы мода внутри папки 'mod' репозитория PampGram
    - name: Unzip and Inject Custom Code
      run: |
        unzip my-workspace/code.zip -d pampgram/mod/
        
        # Выводим структуру, чтобы проверить, куда именно распаковались файлы
        echo "=== Содержимое папки с модом после распаковки ==="
        ls -R pampgram/mod/

    # 5. Генерация конфигурации проекта и сборка через Bazel
    # Мод PampGram базируется на Telegram-iOS, поэтому шаги генерации аналогичны
    - name: Build Module via Bazel
      run: |
        cd pampgram
        
        # Запуск скрипта генерации проекта Telegram (создает необходимые внутренние связи)
        if [ -f build-system/Make/Make.py ]; then
          python3 build-system/Make/Make.py --action=generateProject
        fi
        
        # Компилируем таргет мода. Так как точное имя выходного бинарника зависит от архитектуры,
        # собираем под ios_arm64 (для устройств) в режиме release.
        # Если PampGram собирается как отдельный модуль, Bazel вызовет его.
        bazel build //mod:PampGram --config=ios_arm64 --compilation_mode=release || bazel build //submodules/TelegramCore:TelegramCore --config=ios_arm64 --compilation_mode=release

    # 6. Сохраняем скомпилированные результаты сборки в артефакты
    - name: Upload Compiled Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pampgram-compiled
        # Сохраняем файлы .a или .framework, сгенерированные Bazel в папке bazel-out
        path: |
          pampgram/bazel-out/**/libPampGram.a
          pampgram/bazel-out/**/*.framework
          pampgram/bazel-out/**/libTelegramCore.a
