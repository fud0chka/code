name: Build PampGram Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        path: my-workspace

    - name: Clone Telegram-iOS
      uses: actions/checkout@v4
      with:
        repository: TelegramMessenger/Telegram-iOS
        submodules: recursive
        path: telegram

    - name: Select Xcode 26.2
      run: |
        sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
        sudo xcodebuild -license accept
        xcodebuild -version

    - name: Setup Bazelisk
      run: brew install bazelisk

    - name: Prepare PampGram sources + BUILD
      run: |
        mkdir -p telegram/submodules/PampGram/Sources
        
        unzip -o my-workspace/code.zip -d /tmp/pamp_src/
        find /tmp/pamp_src -name "*.swift" -not -path "*/__MACOSX/*" -exec cp {} telegram/submodules/PampGram/Sources/ \;
        
        echo "=== Swift-файлы ==="
        ls -la telegram/submodules/PampGram/Sources/
        
        # Создаём BUILD
        cat > telegram/submodules/PampGram/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")
        load("@build_bazel_rules_apple//apple:ios.bzl", "ios_framework")

        swift_library(
            name = "PampGramLib",
            module_name = "PampGram",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
            ],
            visibility = ["//visibility:public"],
        )

        ios_framework(
            name = "PampGramFramework",
            bundle_id = "org.telegram.PampGram",
            families = ["iphone", "ipad"],
            infoplists = [],
            minimum_os_version = "13.0",
            deps = [":PampGramLib"],
        )
        EOF

    - name: Create configuration
      run: |
        cd telegram
        mkdir -p build-input
        
        # Почти полный минимальный конфиг (как template_minimal_development_configuration.json)
        cat > build-input/data.json << 'EOF'
        {
          "bundle_id": "org.telegram.Telegram-iOS",
          "api_id": "8",
          "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
          "team_id": "XXXXXXXXXX",
          "app_center_id": "",
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "tg",
          "premium_iap_product_id": "",
          "enable_siri": false,
          "enable_icloud": false
        }
        EOF

    - name: Build via Make.py (официальный путь)
      run: |
        cd telegram
        
        # Используем Make.py — он сам правильно настроит всё окружение
        python3 build-system/Make/Make.py \
          --overrideXcodeVersion \
          build \
          --configurationPath=build-input/data.json \
          --configuration=release_arm64 \
          --buildNumber=10000 \
          --disableProvisioningProfiles \
          --targetName=//submodules/PampGram:PampGramFramework || true
        
        # На случай если --targetName не поддерживается — пробуем прямой вызов bazel
        # с правильными флагами, которые Make.py обычно добавляет
        bazel build //submodules/PampGram:PampGramFramework \
          -c opt \
          --ios_multi_cpus=arm64 \
          --apple_platform_type=ios \
          --define=buildNumber=10000 \
          --//Telegram:disableExtensions \
          --//Telegram:disableStripping \
          --check_direct_dependencies=off \
          --verbose_failures

    - name: Extract dylib
      run: |
        FRAMEWORK=$(find telegram/bazel-out -path "*PampGramFramework.framework" -type d | head -1)
        
        if [ -z "$FRAMEWORK" ]; then
          echo "=== Ищем всё, что связано с PampGram ==="
          find telegram/bazel-out -iname "*pamp*" 2>/dev/null | head -40
          find telegram/bazel-bin -iname "*pamp*" 2>/dev/null | head -40
          exit 1
        fi
        
        echo "Найден framework: $FRAMEWORK"
        ls -la "$FRAMEWORK"
        
        BINARY=""
        if [ -f "$FRAMEWORK/PampGramFramework" ]; then
          BINARY="$FRAMEWORK/PampGramFramework"
        elif [ -f "$FRAMEWORK/PampGram" ]; then
          BINARY="$FRAMEWORK/PampGram"
        fi
        
        if [ -z "$BINARY" ]; then
          echo "Бинарник не найден, содержимое framework:"
          find "$FRAMEWORK" -type f
          exit 1
        fi
        
        cp "$BINARY" ./PampGram.dylib
        echo "=== Готовый dylib ==="
        ls -lh PampGram.dylib
        file PampGram.dylib
        otool -hv PampGram.dylib | head -15

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: PampGram-dylib
        path: PampGram.dylib
