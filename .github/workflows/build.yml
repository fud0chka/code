name: Build PampGram Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4
      with:
        path: my-workspace

    - name: Clone Telegram-iOS
      uses: actions/checkout@v4
      with:
        repository: TelegramMessenger/Telegram-iOS
        submodules: recursive
        path: telegram

    - name: Select Xcode 26.2
      run: |
        sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
        sudo xcodebuild -license accept

    - name: Setup Bazelisk
      run: brew install bazelisk

    - name: Prepare PampGram
      run: |
        mkdir -p telegram/submodules/PampGram/Sources
        
        unzip -o my-workspace/code.zip -d /tmp/pamp_src/
        find /tmp/pamp_src -name "*.swift" -not -path "*/__MACOSX/*" -exec cp {} telegram/submodules/PampGram/Sources/ \;
        
        cat > telegram/submodules/PampGram/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleIdentifier</key>
          <string>org.telegram.PampGram</string>
          <key>CFBundleName</key>
          <string>PampGram</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>CFBundleShortVersionString</key>
          <string>1.0</string>
          <key>CFBundlePackageType</key>
          <string>FMWK</string>
        </dict>
        </plist>
        EOF
        
        cat > telegram/submodules/PampGram/BUILD << 'EOF'
        load("@build_bazel_rules_swift//swift:swift.bzl", "swift_library")
        load("@build_bazel_rules_apple//apple:ios.bzl", "ios_framework")

        swift_library(
            name = "PampGramLib",
            module_name = "PampGram",
            srcs = glob(["Sources/**/*.swift"]),
            deps = [
                "//submodules/Postbox:Postbox",
                "//submodules/TelegramCore:TelegramCore",
                "//submodules/SSignalKit/SwiftSignalKit:SwiftSignalKit",
                "//submodules/AccountContext:AccountContext",
            ],
            visibility = ["//visibility:public"],
        )

        ios_framework(
            name = "PampGramFramework",
            bundle_id = "org.telegram.PampGram",
            families = ["iphone", "ipad"],
            infoplists = ["Info.plist"],
            minimum_os_version = "13.0",
            deps = [":PampGramLib"],
        )
        EOF

    - name: Create config
      run: |
        cd telegram
        mkdir -p build-input
        cat > build-input/data.json << 'EOF'
        {
          "bundle_id": "org.telegram.Telegram-iOS",
          "api_id": "8",
          "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
          "team_id": "XXXXXXXXXX",
          "app_center_id": "",
          "is_internal_build": "true",
          "is_appstore_build": "false",
          "appstore_id": "0",
          "app_specific_url_scheme": "tg",
          "premium_iap_product_id": "",
          "enable_siri": false,
          "enable_icloud": false
        }
        EOF

    - name: Build
      run: |
        cd telegram
        python3 build-system/Make/Make.py \
          --overrideXcodeVersion \
          build \
          --configurationPath=build-input/data.json \
          --configuration=release_arm64 \
          --buildNumber=10000 \
          --xcodeManagedCodesigning \
          --target=//submodules/PampGram:PampGramFramework

    - name: Extract dylib
      run: |
        FRAMEWORK=$(find telegram/bazel-out -path "*PampGramFramework.framework" -type d | head -1)
        
        if [ -z "$FRAMEWORK" ]; then
          echo "Framework не найден"
          find telegram/bazel-out -iname "*pamp*" | head -30
          exit 1
        fi
        
        echo "Найден: $FRAMEWORK"
        
        if [ -f "$FRAMEWORK/PampGramFramework" ]; then
          cp "$FRAMEWORK/PampGramFramework" ./PampGram.dylib
        elif [ -f "$FRAMEWORK/PampGram" ]; then
          cp "$FRAMEWORK/PampGram" ./PampGram.dylib
        else
          find "$FRAMEWORK" -type f
          exit 1
        fi
        
        ls -lh PampGram.dylib
        file PampGram.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: PampGram-dylib
        path: PampGram.dylib
